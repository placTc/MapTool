[package]
name = "maptool-cli"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "maptool"
path = "src/main.rs"

[dependencies]
maptool-core = { path = "../maptool-core", features = ["io"] }
# For --png's color-coded province PNG, since maptool-core doesn't re-export encoding.
image = { version = "0.25", default-features = false, features = ["png"] }
