[package]
name = "maptool-wasm"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `io` brings PNG/BMP decoding into WASM, so pixel values never pass through the
# browser's color pipeline.
maptool-core = { path = "../maptool-core", features = ["io"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
